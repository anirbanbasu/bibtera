# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
name: Rust tests

permissions:
    contents: read
    pull-requests: write
on:
    push:
        branches: [ "master" ]
        paths:
            - "**/*.rs"
            - "**/Cargo.toml"
            - "**/Cargo.lock"
            - ".github/workflows/rust.yml"
    pull_request:
        branches: [ "master" ]
        paths:
            - "**/*.rs"
            - "**/Cargo.toml"
            - "**/Cargo.lock"
            - ".github/workflows/rust.yml"

env:
    CARGO_TERM_COLOR: always

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
              with:
                  egress-policy: audit

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Type check and lint
              # Treat all warnings as errors
              run: cargo clippy -- -D warnings
            - name: Build
              run: cargo build --verbose
            - name: Install Zola
              # Needed by the end-to-end tests that build generated Markdown with Zola.
              # The release archive is pinned by version and verified against its SHA-256 digest.
              env:
                  ZOLA_VERSION: "0.23.6"
                  ZOLA_SHA256: "8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4"
              run: |
                  archive="zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
                  curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/${archive}" \
                      "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/${archive}"
                  echo "${ZOLA_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check -
                  mkdir -p "${RUNNER_TEMP}/zola"
                  tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}/zola"
                  echo "${RUNNER_TEMP}/zola" >> "${GITHUB_PATH}"
            - name: Run tests
              # Fail, rather than skip, the Zola tests if Zola is unavailable.
              env:
                  BIBTERA_REQUIRE_ZOLA: "1"
              run: cargo test -- --test-threads=1
